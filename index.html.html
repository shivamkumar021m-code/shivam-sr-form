<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student PDF Data Extractor</title>
<style>
:root{--bd:#e6e8f5;--tx:#1f2347;--mu:#6b7194;--pr:#5b4bff;--pk:#ec4899;--tl:#10b981;--am:#f59e0b;--er:#e11d48}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,Roboto,sans-serif;color:var(--tx);background:linear-gradient(180deg,#f3f2ff,#f8fbff 40%);min-height:100vh}
h2{margin:0 0 14px;font-size:22px}h3{margin:0}.sec{margin:20px 0 10px}.muted{color:var(--mu)}.small{font-size:12px}.center{text-align:center}.big{font-size:26px;font-weight:700}.nowrap{white-space:nowrap}
.app{display:flex;min-height:100vh}.side{width:230px;background:linear-gradient(180deg,#1b1464,#4a1d96 60%,#7a2a9e);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{font-weight:800;font-size:16px;padding:6px 10px 18px;line-height:1.3}.brand small{display:block;font-weight:400;opacity:.7;font-size:11px}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;color:#e9e5ff;padding:10px 12px;border-radius:10px;cursor:pointer;font:inherit;margin-bottom:3px}
.nav:hover{background:#ffffff1f}.nav.on{background:linear-gradient(90deg,#ff7ac8,#8b6bff);color:#fff;font-weight:600;box-shadow:0 6px 16px #0004}.pill{background:#fff;color:var(--er);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.main{flex:1;min-width:0}.top{display:flex;gap:12px;align-items:center;padding:12px 22px;background:#ffffffcc;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.search{flex:1;max-width:540px;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;font:inherit;background:#fff}.search:focus,input:focus,select:focus,textarea:focus{outline:2px solid #b9b2ff;border-color:var(--pr)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--pk));color:#fff;display:grid;place-items:center;font-weight:700}.user b{display:block;line-height:1.2}
.menu{display:none}.content{padding:22px}
.btn{border:1px solid var(--bd);background:#fff;padding:8px 15px;border-radius:10px;cursor:pointer;font:inherit;color:var(--tx)}.btn:hover:not(:disabled){background:#f1f0ff}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--pr),#8b5cf6);border:0;color:#fff;box-shadow:0 6px 14px #5b4bff44}.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:linear-gradient(135deg,var(--pr),#8b5cf6)}
.btn.danger{color:var(--er)}.btn.ghost{border-color:transparent;background:none}.btn.sm{padding:3px 10px;font-size:12px}.btn.good{background:linear-gradient(135deg,#059669,var(--tl));border:0;color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 6px 22px #4b3dff12;margin-bottom:14px}
.stat{display:flex;gap:14px;align-items:center;color:#fff;border:0;margin:0}.stat .muted{color:#ffffffcc}.stat .ico{font-size:28px;background:#ffffff2e;border-radius:14px;width:54px;height:54px;display:grid;place-items:center}
.stat:nth-child(1){background:linear-gradient(135deg,#5b4bff,#8b5cf6)}.stat:nth-child(2){background:linear-gradient(135deg,#0ea5e9,#22d3ee)}.stat:nth-child(3){background:linear-gradient(135deg,#f59e0b,#fb7185)}.stat:nth-child(4){background:linear-gradient(135deg,#10b981,#34d399)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}.chip b{background:#eeeaff;color:var(--pr);border-radius:99px;padding:0 8px;margin-left:4px;font-size:12px}
.chip.on{background:linear-gradient(135deg,var(--pr),var(--pk));color:#fff;border:0}.chip.on b{background:#ffffff40;color:#fff}
.drop{border:2px dashed #b9b2ff;border-radius:18px;background:linear-gradient(135deg,#fff,#f4f1ff);padding:40px 16px;text-align:center;display:grid;gap:10px;justify-items:center}.drop.on{border-color:var(--pk);background:#fff0f8}
.progress{position:relative;height:28px;background:#e5e7f5;border-radius:99px;margin:14px 0;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--pr),var(--pk));transition:width .2s}.progress span{position:absolute;inset:0;text-align:center;line-height:28px;font-size:13px;font-weight:600;color:#1f2347}
.notice{margin:14px 0;padding:12px 16px;background:#eefcf6;border:1px solid #b7ecd3;border-radius:12px;font-weight:500}.notice.bad{background:#fff1f2;border-color:#fecdd3}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}.bar h2{margin:0}
.tablewrap{overflow:auto;background:#fff;border:1px solid var(--bd);border-radius:16px;max-height:66vh;box-shadow:0 6px 22px #4b3dff12}.tbl{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:9px 11px;border-bottom:1px solid #eef0fa;text-align:left;vertical-align:top}.tbl th{background:linear-gradient(180deg,#f3f1ff,#ece9ff);position:sticky;top:0;white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#4a3fc7}
.tbl th.sort{cursor:pointer}.tbl tbody tr:hover td{background:#faf9ff}.addr{min-width:180px;max-width:280px}.tbl input{width:100%;min-width:110px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;font:inherit}
.tbl input.miss{border-color:var(--am);background:#fffbeb}.tbl tr.diff td{background:#fff7ed}.nf{color:var(--er);font-size:12px;font-style:italic}
.badge{padding:2px 10px;border-radius:99px;font-size:12px;white-space:nowrap;font-weight:600}.badge.ok{background:#d1fae5;color:#047857}.badge.warn{background:#fef3c7;color:#b45309}.badge.err{background:#ffe4e6;color:var(--er)}
.cb{display:inline-block;min-width:26px;text-align:center;background:linear-gradient(135deg,#ede9fe,#fce7f3);color:#5b21b6;border-radius:8px;padding:0 8px;font-weight:700}
select,input[type=number]{padding:7px 10px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff}
.overlay{position:fixed;inset:0;background:#1b146488;display:grid;place-items:center;z-index:20;padding:12px}.modal{background:#fff;border-radius:18px;padding:20px;width:min(660px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 60px #0006}.modal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0}.dl dt{font-size:12px;color:var(--mu)}.dl dd{margin:0;font-weight:600}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:4px;font-size:12px;color:var(--mu)}.form .wide{grid-column:1/-1}.form input:not([type=checkbox]),.form textarea{padding:9px;border:1px solid var(--bd);border-radius:10px;font:14px inherit;color:var(--tx)}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.step{flex:1;min-width:130px;padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--bd);color:var(--mu);font-weight:600;text-align:center}.step.on{background:linear-gradient(135deg,var(--pr),var(--pk));color:#fff;border:0}.step.done{background:#d1fae5;color:#047857;border-color:#b7ecd3}
@media(max-width:820px){.side{position:fixed;left:-250px;z-index:15;transition:left .2s}.side.open{left:0}.menu{display:inline-block}.form,.dl{grid-template-columns:1fr}.content{padding:12px}.user b+span{display:none}}
</style></head>
<body>
<div class="app">
  <aside id="side" class="side"></aside>
  <div class="main">
    <header class="top">
      <button class="btn ghost menu" data-a="menu">☰</button>
      <input id="q" class="search" placeholder="Search name, father, mother, admission no., PEN, mobile…" autocomplete="off">
      <div class="user"><div class="av">SK</div><div><b>Shivam Kumar</b><span class="muted small">School Admin</span></div></div>
    </header>
    <main id="content" class="content"><p class="muted">Loading…</p></main>
  </div>
</div>
<div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/*CORE*/
const FIELDS=[['name','Student Name'],['father','Father Name'],['mother','Mother Name'],['cls','Class'],['section','Section'],['dob','DOB'],['address','Address'],['mobile','Mobile'],['admissionNo','Admission No.'],['pen','PEN (Permanent Education No.)'],['aadhaar','Aadhaar No.']];
const emptyDraft=()=>({name:'',father:'',mother:'',cls:'',section:'',dob:'',address:'',mobile:'',admissionNo:'',aadhaar:'',udise:'',pen:'',year:'',remark:'',prevSchool:''});
const clean=s=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f<>]/g,' ').replace(/\s+/g,' ').trim();
const blankNA=s=>/^(na|n\/a|-|null)$/i.test(s)?'':s;
function itemsToText(items){
  const rows=[];
  for(const it of items){ if(!it.str.trim())continue; const y=it.transform[5],x=it.transform[4];
    let r=rows.find(r=>Math.abs(r.y-y)<3); if(!r){r={y,parts:[]};rows.push(r);} r.parts.push({x,s:it.str}); }
  return rows.sort((a,b)=>b.y-a.y).map(r=>r.parts.sort((a,b)=>a.x-b.x).map(p=>p.s).join(' ')).join('\n');
}
const STOPS=[/General Information of Student/,/Gender \(as/,/Mother Tongue/,/Date of Birth/,/Permanent Education Number/,/Social Category/,/Mother['’]s Name/,/Minority Group/,/Father['’]s Name/,/Whether BPL/,/Guardian['’]s Name/,/Whether Antyodaya/,/AADHAAR Number of Student/,/Whether belongs to EWS/,/Name of Student as per/,/Whether CWSN/,/Address/,/Type of Impairments/,/Pincode/,/Indian Nationality/,/Mobile Number/,/Alternate Mobile/,/Is Child Identified/,/Contact email/,/Enrolment Details/,/Admission Number in Present/,/Admission Date/,/Class\/Section Roll/,/Medium of Instruction/,/Class\s*:/,/Section\s*:/];
function after(t,label){const m=label.exec(t); if(!m)return ''; const rest=t.slice(m.index+m[0].length); let end=rest.length;
  for(const s of STOPS){const i=rest.search(s); if(i>=0&&i<end)end=i;} return blankNA(clean(rest.slice(0,end)));}
const first=(t,re)=>clean((re.exec(t)||[])[1]||'');
function parseStudentText(raw){
  const t=raw.replace(/\s+/g,' '); const d=emptyDraft();
  d.year=first(t,/Academic Year\s*:\s*(\d{4}-\d{2,4})/); d.udise=first(t,/UDISE Code\s*:\s*(\d+)/);
  d.name=first(t,/Student Name\s*:\s*(.+?)\s+Class\s*:/); d.cls=first(t,/\bClass\s*:\s*(\S+)\s+Section\s*:/); d.section=first(t,/Section\s*:\s*(\S+)/);
  d.mother=after(t,/Mother['’]s Name/); d.father=after(t,/Father['’]s Name/);
  d.dob=first(t,/Date of Birth[^\d]*?(\d{2}\/\d{2}\/\d{4})/); d.pen=first(t,/Permanent Education Number\s*(\d+)/);
  d.mobile=first(t,/(?<!Alternate )Mobile Number\s*\(of[^)]*\)\s*(\d{10})\b/);
  d.aadhaar=first(t,/AADHAAR Number of Student\s*([\d*Xx-]{8,16})/).replace(/-/g,''); if(!/^[\d*Xx]{8,12}$/.test(d.aadhaar))d.aadhaar='';
  d.admissionNo=after(t,/Admission Number in Present School/); if(!/^[\w\/-]{1,20}$/.test(d.admissionNo))d.admissionNo='';
  const addr=after(t,/\bAddress\b/),pin=first(t,/Pincode\s*(\d{6})/); d.address=addr?(pin?addr+' - '+pin:addr):'';
  const missing=FIELDS.map(f=>f[0]).filter(k=>!d[k]);
  return {data:d,missing,recognised:/Student Name\s*:/.test(t)};
}
const CRITICAL=['name','cls','dob','admissionNo'];
const statusFor=(missing,ocr,rec)=>(ocr||!rec||missing.some(k=>CRITICAL.includes(k)))?'review':'ok';
/* class order: Nursery/LKG/UKG, then I, II, III ... XII */
const ROMAN={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8,IX:9,X:10,XI:11,XII:12};
function classRank(c){const t=clean(c).toUpperCase().replace(/^(CLASS|STD)\s*/,''); const p=['PRE-NURSERY','NURSERY','LKG','UKG','KG'].indexOf(t);
  if(p>=0)return p-10; if(ROMAN[t])return ROMAN[t]; const n=parseInt(t,10); return isNaN(n)?99:n;}
const admCmp=(a,b)=>{const x=String(a.admissionNo||'').trim(),y=String(b.admissionNo||'').trim(); if(!x&&!y)return 0; if(!x)return 1; if(!y)return -1; return x.localeCompare(y,undefined,{numeric:true});};
/* list/export order: class -> Admission Number sequence (1,2,3...10,11) -> section -> name. Upload order does not matter. */
const compareStudents=(a,b)=>classRank(a.cls)-classRank(b.cls)||a.cls.localeCompare(b.cls)||admCmp(a,b)||a.section.localeCompare(b.section)||a.name.localeCompare(b.name);
const classesOf=l=>[...new Set(l.map(s=>s.cls).filter(Boolean))].sort((a,b)=>classRank(a)-classRank(b)||a.localeCompare(b));
/* duplicates */
const nz=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function findDuplicate(d,list){
  if(d.admissionNo){const e=list.find(s=>nz(s.admissionNo)===nz(d.admissionNo)); if(e)return {existing:e,reason:'Same Admission Number ('+d.admissionNo+')'};}
  if(d.pen){const e=list.find(s=>nz(s.pen)===nz(d.pen)); if(e)return {existing:e,reason:'Same PEN ('+d.pen+')'};}
  if(d.name&&d.dob){const e=list.find(s=>nz(s.name)===nz(d.name)&&s.dob===d.dob&&(!s.father||!d.father||nz(s.father)===nz(d.father))); if(e)return {existing:e,reason:'Same Student Name, Date of Birth and Father Name'};}
  return null;
}
const mergeInto=(e,d)=>{const o={...e}; for(const k in d) if(d[k])o[k]=d[k]; return o;};
/* export */
const maskAadhaar=a=>{const l=String(a||'').replace(/\D/g,'').slice(-4); return l?'XXXX-XXXX-'+l:'';};
const HEADERS=['Sr. No.','Student Name','Father Name','Mother Name','Class','Section','DOB','Address','Mobile Number','Admission Number','PEN (Permanent Education No.)','Aadhaar Number','Previous Year School Name','Remark'];
const safeCell=v=>(/^[=+\-@]/.test(v)&&!/^[-\d]+$/.test(v))?"'"+v:v;
const toRows=(list,reveal)=>list.map((s,i)=>[String(i+1),s.name,s.father,s.mother,s.cls,s.section,s.dob,s.address,s.mobile,s.admissionNo,s.pen||'',reveal?s.aadhaar:maskAadhaar(s.aadhaar),s.prevSchool||'',s.remark||''].map(safeCell));
function makeSheet(XL,list,reveal){
  const ws=XL.utils.aoa_to_sheet([HEADERS,...toRows(list,reveal)]);
  Object.keys(ws).filter(k=>k[0]!=='!').forEach(k=>{ws[k].t='s';ws[k].v=String(ws[k].v);delete ws[k].z;});
  ws['!cols']=HEADERS.map((h,i)=>({wch:(i===7||i>=12)?40:Math.max(12,h.length+2)})); return ws;
}
function makeWorkbook(XL,list,reveal,mode,title){
  const wb=XL.utils.book_new(), add=(l,n)=>XL.utils.book_append_sheet(wb,makeSheet(XL,l,reveal),String(n).replace(/[\\\/?*\[\]:]/g,'-').slice(0,31));
  const byAdm=l=>[...l].sort((a,b)=>admCmp(a,b)||compareStudents(a,b));
  if(mode==='single'||mode==='both')add(byAdm(list),title||'All Classes'); /* all classes, one sheet, serial by Admission No. */
  if(mode==='classwise'||mode==='both'){
    for(const c of classesOf(list))add(list.filter(s=>s.cls===c).sort(compareStudents),'Class '+c);
    const none=list.filter(s=>!s.cls); if(none.length)add(none.sort(compareStudents),'No Class');
  }
  return wb;
}
function toCsv(list,reveal){
  const text=new Set([8,9,10,11]); const q=(v,i)=>(text.has(i)&&/^0\d*$/.test(v))?'="'+v+'"':'"'+v.replace(/"/g,'""')+'"';
  return '\uFEFF'+[HEADERS.map(h=>'"'+h+'"').join(','),...toRows(list,reveal).map(r=>r.map(q).join(','))].join('\r\n');
}
/*ENDCORE*/
/* ---------- storage: IndexedDB (swap this block for fetch() calls to use a real backend) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('student-pdf-extractor',1);
    r.onupgradeneeded=()=>{r.result.createObjectStore('students',{keyPath:'id'});r.result.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async run(store,mode,f){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const rq=f(tx.objectStore(store));
    tx.oncomplete=()=>{db.close();res(rq?rq.result:undefined);};tx.onerror=()=>rej(tx.error);});},
  list:async()=>(await DB.run('students','readonly',s=>s.getAll())).sort((a,b)=>a.createdAt-b.createdAt),
  putMany:l=>DB.run('students','readwrite',s=>{l.forEach(x=>s.put(x));}),
  remove:id=>DB.run('students','readwrite',s=>{s.delete(id);}),
  async clear(){await DB.run('students','readwrite',s=>{s.clear();});await DB.run('kv','readwrite',s=>{s.clear();});},
  async get(k,fb){const v=await DB.run('kv','readonly',s=>s.get(k));return v==null?fb:v;},
  set:(k,v)=>DB.run('kv','readwrite',s=>{s.put(v,k);}),
};
const uid=()=>crypto.randomUUID();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);

/* ---------- PDF extraction (real, in-browser) ---------- */
const fail=(fileName,error)=>({tempId:uid(),fileName,status:'error',error,missing:[],data:emptyDraft(),usedOcr:false});
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function ocrPage(page){
  const vp=page.getViewport({scale:2.5});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  if(!window.Tesseract)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js');
  return (await Tesseract.recognize(c,'eng')).data.text;
}
async function extractPdf(file,maxMb){
  if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name))return fail(file.name,'Only PDF files are allowed');
  if(file.size>maxMb*1048576)return fail(file.name,'File is larger than '+maxMb+' MB');
  if(!window.pdfjsLib)return fail(file.name,'PDF library not loaded (internet needed once)');
  try{
    const buf=await file.arrayBuffer();
    if(new TextDecoder().decode(buf.slice(0,5))!=='%PDF-')return fail(file.name,'Unable to read PDF');
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;let text='';
    for(let i=1;i<=Math.min(doc.numPages,3);i++){const p=await doc.getPage(i);text+=itemsToText((await p.getTextContent()).items)+'\n';}
    let ocr=false;
    if(text.replace(/\s/g,'').length<40){try{text=await ocrPage(await doc.getPage(1));ocr=true;}catch(e){return fail(file.name,'Unable to read PDF (OCR failed)');}}
    const {data,missing,recognised}=parseStudentText(text);
    return {tempId:uid(),fileName:file.name,status:statusFor(missing,ocr,recognised),missing,data,usedOcr:ocr};
  }catch(e){return fail(file.name,'Unable to read PDF');}
}

/* ---------- state ---------- */
const S={view:'dash',students:[],dups:[],stats:{pdfs:0,dups:0},settings:{reveal:false,maxMb:10},pending:[],prog:null,msg:'',msgBad:false,
  q:'',cls:'',sec:'',sort:{k:'cls',dir:1},page:0,size:25,xcls:'',xmode:'both',show:false,drag:false,batch:{ids:[],saved:false,completed:false},remDraft:{},remAll:false};
const NAV=[['dash','📊','Dashboard'],['up','📤','1. Add Students'],['rem','📝','2. Remarks'],['done','✅','3. Complete'],['list','🎓','Student List'],['dup','⚠️','Duplicates'],['exp','⬇️','Export'],['set','⚙️','Settings']];
const saveBatch=()=>DB.set('batch',S.batch), saveDups=()=>DB.set('dups',S.dups), saveStats=()=>DB.set('stats',S.stats);
const nf='<span class="nf">Field not found</span>';
const aad=(s,show)=>esc(show?s.aadhaar:maskAadhaar(s.aadhaar));

/* ---------- views ---------- */
function vDash(){
  const rec=S.students.filter(s=>Date.now()-s.createdAt<864e5).length;
  const cards=[['Total Students',S.students.length,'👩‍🎓'],['PDFs Processed',S.stats.pdfs,'📄'],['Duplicates Found',S.stats.dups,'⚠️'],['Recently Added (24h)',rec,'✨']];
  const cl=classesOf(S.students);
  return `<h2>Dashboard</h2><div class="cards">${cards.map(c=>`<div class="card stat"><span class="ico">${c[2]}</span><div><div class="muted">${c[0]}</div><div class="big">${c[1]}</div></div></div>`).join('')}</div>
  <h3 class="sec">Class-wise students</h3>${cl.length?`<div class="chips">${cl.map(c=>`<button class="chip" data-a="goclass" data-c="${esc(c)}">Class ${esc(c)} <b>${S.students.filter(s=>s.cls===c).length}</b></button>`).join('')}</div>`:'<p class="muted">No students yet. Open <b>Upload PDFs</b> to add your first batch.</p>'}`;
}

async function handleFiles(files){
  const list=[...files];if(!list.length)return; S.msg='';S.msgBad=false;S.prog={done:0,total:list.length};render();let bad=0,rev=0;
  for(let i=0;i<list.length;i++){ // one PDF at a time, so one bad file never stops the batch
    const r=await extractPdf(list[i],S.settings.maxMb);S.pending.push(r);S.prog.done=i+1;r.status==='error'?bad++:r.status==='review'&&rev++;
    if(S.view==='up')render();
  }
  S.stats.pdfs+=list.length;await saveStats();S.prog=null;
  S.msg=`${list.length} PDFs processed · ${list.length-bad} read · ${rev} need review · ${bad} could not be read`;S.msgBad=bad>0;render();
}
async function addBatch(){
  const list=[...S.students],added=[],found=[],keep=[];let bad=0;
  for(const r of S.pending){
    if(r.status==='error'){bad++;continue;}
    const d={...emptyDraft(),...Object.fromEntries(Object.entries(r.data).map(([k,v])=>[k,clean(v)]))};
    if(!d.name){keep.push(r);continue;} /* name is required */
    const hit=findDuplicate(d,list);
    if(hit)found.push({id:uid(),fileName:r.fileName,draft:d,existing:hit.existing,reason:hit.reason});
    else{const s={...d,id:uid(),createdAt:Date.now()+added.length};list.push(s);added.push(s);}
  }
  await DB.putMany(added);S.students=list;
  if(found.length){S.dups.push(...found);S.stats.dups+=found.length;await saveDups();await saveStats();}
  S.pending=keep;
  if(added.length){const old=S.batch.completed?[]:S.batch.ids;S.batch={ids:[...old,...added.map(s=>s.id)],saved:false,completed:false};await saveBatch();}
  S.msg=`✓ ${added.length} Students Submitted · ⚠ ${found.length} Duplicates Found${found.length?' (see Duplicates)':''} · ⚠ ${bad} PDF Could Not Be Read`+(keep.length?` · ✎ ${keep.length} row(s) without Student Name were kept in Step 1`:'');
  S.msgBad=keep.length>0;S.view=added.length?'rem':'up';render();
}

  async confirmok(){const f=onOk;onOk=null;closeModal();if(f)await f();},
  toggleaad:d=>{S.show=!S.show;viewModal(find(d.id));},
  closemodal:(d,e)=>{if(e.target===e.currentTarget)closeModal();},
  async resolve(d){const x=S.dups.find(i=>i.id===d.id);if(!x)return;const inBatch=id=>{if(S.batch.completed)S.batch={ids:[],saved:false,completed:false};if(!S.batch.ids.includes(id))S.batch.ids.push(id);S.batch.saved=false;};
    if(d.r==='update'){const s=mergeInto(x.existing,x.draft);await DB.putMany([s]);S.students=S.students.map(a=>a.id===s.id?s:a);inBatch(s.id);}
    if(d.r==='new'){const s={...x.draft,id:uid(),createdAt:Date.now()};await DB.putMany([s]);S.students.push(s);inBatch(s.id);}
    S.dups=S.dups.filter(i=>i.id!==d.id);await saveDups();await saveBatch();render();},
  xlsx:()=>{XLSX.writeFile(makeWorkbook(XLSX,exportList(),S.settings.reveal,S.xcls?'single':S.xmode,S.xcls?'Class '+S.xcls:'All Classes'),exName('xlsx'));},
  csv:()=>download(new Blob([toCsv(csvList(),S.settings.reveal)],{type:'text/csv;charset=utf-8'}),exName('csv')),

    Object.assign(S,{batch:{ids:[],saved:false,completed:false},remDraft:{},students:[],dups:[],stats:{pdfs:0,dups:0},settings:{reveal:false,maxMb:10},pending:[],msg:''});render();});},
};
function viewModal(s){
  modal('Student Details',`<dl class="dl">${FIELDS.map(f=>`<div><dt>${f[1]}</dt><dd>${f[0]==='aadhaar'?aad(s,S.show)+(S.settings.reveal&&s.aadhaar?` <button class="btn sm" data-a="toggleaad" data-id="${s.id}">${S.show?'Hide':'Show'}</button>`:''):(esc(s[f[0]])||nf)}</dd></div>`).join('')}
  <div><dt>Previous Year School</dt><dd>${esc(s.prevSchool)||'—'}</dd></div><div><dt>Remark</dt><dd>${esc(s.remark)||'—'}</dd></div><div><dt>Academic Year</dt><dd>${esc(s.year)||'—'}</dd></div><div><dt>UDISE Code</dt><dd>${esc(s.udise)||'—'}</dd></div></dl>`);
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&ACT[b.dataset.a])ACT[b.dataset.a](b.dataset,{target:e.target,currentTarget:b});});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.pv){const [id,k]=t.dataset.pv.split('|');const r=S.pending.find(x=>x.tempId===id);if(r){r.data[k]=t.value;t.classList.toggle('miss',!t.value.trim());}}
  if(t.dataset.rm||t.dataset.ps){const id=t.dataset.rm||t.dataset.ps,k=t.dataset.rm?'remark':'prevSchool';(S.remDraft[id]=S.remDraft[id]||{})[k]=t.value;}
  if(t.id==='q'){S.q=t.value;S.page=0;if(S.view!=='list')S.view='list';render();}});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id==='file'){handleFiles(t.files);t.value='';}
  if(t.dataset.sel){const k=t.dataset.sel;S[k]=k==='size'?+t.value:t.value;S.page=0;render();}
  if(t.dataset.chk==='remall'){S.remAll=t.checked;render();}
  if(t.dataset.chk==='reveal'){const on=t.checked;
    if(!on){S.settings.reveal=false;await DB.set('settings',S.settings);render();}
    else{render();ask('Allow full Aadhaar numbers to be shown and exported? Only enable this for authorised staff.','Yes, Allow',async()=>{S.settings.reveal=true;await DB.set('settings',S.settings);render();});}}
  if(t.dataset.num){S.settings.maxMb=Math.min(50,Math.max(1,+t.value||10));await DB.set('settings',S.settings);render();}});
document.addEventListener('dragover',e=>{if($('drop')){e.preventDefault();$('drop').classList.add('on');}});
document.addEventListener('dragleave',e=>{if($('drop')&&!e.relatedTarget)$('drop').classList.remove('on');});
document.addEventListener('drop',e=>{if($('drop')){e.preventDefault();$('drop').classList.remove('on');if(S.view==='up')handleFiles(e.dataTransfer.files);}});

/* ---------- start ---------- */
(async()=>{
  if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  try{S.students=await DB.list();S.dups=await DB.get('dups',[]);S.stats=await DB.get('stats',{pdfs:0,dups:0});S.batch=await DB.get('batch',S.batch);S.settings=await DB.get('settings',S.settings);}
  catch(e){S.msg='Browser storage is unavailable (private mode?). Data will not be saved.';S.msgBad=true;}
  render();
})();
</script>
</body></html>
